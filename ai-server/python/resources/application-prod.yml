spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.4-mini
tavily:
  api-key: ${TAVILY_API_KEY}

aws:
  dynamodb:
    # 프로덕션에서는 보통 endpointOverride 없이 AWS 기본 엔드포인트를 사용합니다.
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:ap-northeast-2}
    tables:
      resume-coordinates: ${AWS_DYNAMODB_TABLE_RESUME_COORDINATES:pertino-resume-coordinates}
      document-context: ${AWS_DYNAMODB_TABLE_DOCUMENT_CONTEXT:pertineo-document-context}

langsmith:
  api:
    key: ${LANGSMITH_API_KEY}
  project: ${LANGSMITH_PROJECT:pertineo-default} # 환경변수가 없으면 'pertineo-default'로 동작
pertineo:
  smart-parsing:
    primary-model: ${SMART_PARSING_PRIMARY_MODEL:gpt-5-nano}
    fallback-model: ${SMART_PARSING_FALLBACK_MODEL:gpt-5-mini}
    fallback-enabled: ${SMART_PARSING_FALLBACK_ENABLED:true}
    fallback-max-chars: ${SMART_PARSING_FALLBACK_MAX_CHARS:1000}
