<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head('공지사항 작성')}"></head>
<body>
<header th:replace="~{_layout :: topbar}"></header>

<main class="container narrow">
    <h2>공지사항 작성</h2>
    <form class="form" th:action="@{/admin/notices/form}" method="post">
        <div class="form-row">
            <label>제목</label>
            <input type="text" name="title" placeholder="제목을 입력하세요" required />
        </div>
        <div class="form-row">
            <label>내용</label>
            <!-- ✅ textarea 유지 (id 추가) -->
            <textarea id="editor" name="content" rows="14" placeholder="내용을 입력하세요 (필요 시 HTML 허용)" required></textarea>
        </div>

        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/admin}">취소</a>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</main>

<footer th:replace="~{_layout :: footer}"></footer>

<!-- ✅ CKEditor CDN 추가 -->
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
<script>
    CKEDITOR.replace('editor', {
        height: 400
    });
</script>

</body>
</html>
